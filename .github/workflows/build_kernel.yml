name: Build OnePlus 9RT Kernel (SukiSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev lld llvm python3 python-is-python3 tar unzip wget zip zstd gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Toolchain (Clang)
        run: |
          git clone --depth=1 https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone clang

      - name: Integrate SukiSU Ultra
        run: |
          # Используем официальный скрипт интеграции SukiSU
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: Apply Config & Tweaks
        run: |
          # Ищем рекурсивно с учетом папок vendor/ и др.
          DEFCONFIG_PATH=$(find arch/arm64/configs -name "*lahaina*defconfig" -o -name "*martini*defconfig" -o -name "*lemans*defconfig" | head -n 1)
          
          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "Error: Defconfig not found! Listing available configs:"
            find arch/arm64/configs -name "*.defconfig"
            exit 1
          fi
          
          DEFCONFIG=$(basename "$DEFCONFIG_PATH")
          echo "Using defconfig: $DEFCONFIG (Path: $DEFCONFIG_PATH)"
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

          # Путь к реальному конфигу для scripts/config (т.к. он лежит в подпапке)
          ./scripts/config --file "$DEFCONFIG_PATH" \
            -e KSU \
            -e KPM \
            -e KALLSYMS \
            -e KALLSYMS_ALL

          ./scripts/config --file "$DEFCONFIG_PATH" \
            -e TCP_CONG_BBR \
            -e DEFAULT_BBR \
            -e NET_SCH_FQ_CODEL \
            -e HZ_300 \
            -d HZ_100 \
            -d HZ_250 \
            -e LTO_CLANG_THIN \
            -d LTO_NONE \
            -d DEBUG_KERNEL
            
      - name: Compile Kernel
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 $DEFCONFIG
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Kernel-SU/AnyKernel3 -b master AnyKernel3
          rm -rf AnyKernel3/.git
          
          # Копируем ядро и device tree
          cp out/arch/arm64/boot/Image AnyKernel3/
          find out/arch/arm64/boot/ -name "*.dtb" -exec cp {} AnyKernel3/ \;
          find out/arch/arm64/boot/ -name "dtbo.img" -exec cp {} AnyKernel3/ \;
          
          cd AnyKernel3
          zip -r9 ../OnePlus9RT-SukiSU-Kernel.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9RT-SukiSU-Kernel
          path: OnePlus9RT-SukiSU-Kernel.zip
